services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: centroempresarial_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - WHATSAPP_SERVICE_URL=http://whatsapp_service:3001
    volumes:
      - ./backend:/app
      - backend_static:/app/static/uploads
    networks:
      - ce_network

  whatsapp_service:
    build:
      context: ./backend/whatsapp-service
      dockerfile: Dockerfile
    container_name: centroempresarial_whatsapp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - INTERNAL_WHATSAPP_TOKEN=ce_internal_secret_token_wa_9981
    volumes:
      - ./backend/whatsapp-service/whatsapp-session:/app/whatsapp-session
    networks:
      - ce_network

volumes:
  backend_static:

networks:
  ce_network:
    driver: bridge
